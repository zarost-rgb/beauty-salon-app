services:
  # 1. Baza danych PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: beauty-salon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-beauty_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-beauty_secret_pass}
      POSTGRES_DB: ${DB_NAME:-beauty_salon_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-beauty_user} -d ${DB_NAME:-beauty_salon_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - beauty-network

  # 2. Backend REST API (Node.js Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: beauty-salon-backend:latest
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-beauty_user}
      DB_PASSWORD: ${DB_PASSWORD:-beauty_secret_pass}
      DB_NAME: ${DB_NAME:-beauty_salon_db}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - beauty-network

  # 3. Frontend SPA (Nginx Alpine)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: beauty-salon-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    networks:
      - beauty-network

  # 4. Nginx Reverse Proxy / API Gateway (Single Entry Point)
  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: beauty-salon-proxy:latest
    container_name: beauty-salon-proxy
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - beauty-network

volumes:
  postgres_data:
    name: beauty_salon_postgres_data

networks:
  beauty-network:
    name: beauty-network
    driver: bridge
