# ==============================================================================
# Konfiguracja Ansible dla projektu Beauty Salon App (AWS EC2)
# ==============================================================================

[defaults]
# Domyslny plik inwentarza
inventory = inventory.ini

# Domyslny uzytkownik polaczenia SSH dla obrazow bazowych Ubuntu na AWS
remote_user = ubuntu

# Wylaczenie sprawdzania klucza hosta SSH (przydatne przy dynamicznych adresach AWS EC2)
host_key_checking = False

# Wylaczenie tworzenia plikow *.retry przy bledach zadan
retry_files_enabled = False

# Czytelny format wyjscia zadan w terminalu (YAML)
stdout_callback = yaml

# Maksymalny czas oczekiwania na odpowiedz (sekundy)
timeout = 30

[privilege_escalation]
# Automatyczna eskalacja uprawnien do roota przy zadaniach administracyjnych
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Wlaczenie pipeliningu dla przyspieszenia wykonywania playbookow
pipelining = True

# Opcje SSH optymalizujace polaczenie terminalowe
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
