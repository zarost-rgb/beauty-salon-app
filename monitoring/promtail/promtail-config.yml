# ==============================================================================
# Konfiguracja Promtail (Zbieranie logow kontenerow Docker i wysylka do Loki)
# ==============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Automatyczne wykrywanie i zbieranie logow ze wszystkich kontenerow Docker
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
      - source_labels: ["container"]
        target_label: "job"
        replacement: "docker-$1"

  # 2. Zbieranie logow systemowych z /var/log hosta (opcjonalnie)
  - job_name: host-system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/syslog
